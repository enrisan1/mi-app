name: KGV CR-KGV-03 regression verification

on:
  push:
    branches:
      - work/kgv-cr03-regression

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - name: Historical PostV1 tests
        run: npm test -- --run src/realizations/post-v1-integrated/PostV1IntegratedExperience.test.tsx
      - name: Historical App tests
        run: npm test -- --run src/App.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Full suite
        run: npm test -- --run
