name: CONV-HPI-10 global gate
on:
  push:
    branches:
      - conv-hpi-10-global-gate
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Global horizon validation
        run: npx vitest run src/App.hpi.global.validation.test.tsx
      - name: HPI milestones preservation
        run: npx vitest run src/App.hpi.test.tsx src/App.hpi.validation.test.tsx src/App.hpi2.test.tsx src/App.hpi2.validation.test.tsx
      - name: Full regression
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Typecheck delta
        run: |
          set +e
          npm run typecheck > /tmp/current-typecheck.log 2>&1
          current_code=$?
          grep 'error TS' /tmp/current-typecheck.log | sort > /tmp/current-errors.txt || true
          git checkout cdb4fa835544a8ce6ff56dc8f75c2b3e1f5540dc
          npm run typecheck > /tmp/base-typecheck.log 2>&1
          base_code=$?
          grep 'error TS' /tmp/base-typecheck.log | sort > /tmp/base-errors.txt || true
          set -e
          echo "current_code=$current_code base_code=$base_code"
          echo "current_errors=$(wc -l < /tmp/current-errors.txt)"
          echo "base_errors=$(wc -l < /tmp/base-errors.txt)"
          diff -u /tmp/base-errors.txt /tmp/current-errors.txt
          test "$current_code" -eq "$base_code"
      - name: Diff check
        run: |
          git checkout "$GITHUB_SHA"
          git diff --check cdb4fa835544a8ce6ff56dc8f75c2b3e1f5540dc..HEAD -- src/App.hpi.global.validation.test.tsx
