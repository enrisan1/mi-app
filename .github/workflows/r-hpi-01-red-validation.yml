name: R-HPI-01 red-test validation

on:
  push:
    branches:
      - r-hpi-01-red-tests-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Confirm focused HPI suite is materially red
        shell: bash
        run: |
          set +e
          npx vitest run src/App.hpi.test.tsx > /tmp/hpi-red.log 2>&1
          code=$?
          set -e
          cat /tmp/hpi-red.log
          if [ "$code" -eq 0 ]; then
            echo "::error::The HPI suite is unexpectedly green."
            exit 1
          fi
          echo "Focused HPI suite is red as expected."

      - name: Historical regression remains green
        run: npx vitest run --exclude src/App.hpi.test.tsx
