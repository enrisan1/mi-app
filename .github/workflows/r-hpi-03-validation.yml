name: R-HPI-03 formal validation
on:
  push:
    branches:
      - r-hpi-03-validation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Formal HPI validation
        run: npx vitest run src/App.hpi.test.tsx src/App.hpi.validation.test.tsx
      - name: Typecheck regression against pre-HPI-production baseline
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/current-typecheck.log 2>&1
          current_code=$?
          set -e
          grep 'error TS' /tmp/current-typecheck.log | sort > /tmp/current-errors.txt || true

          git fetch origin 17b792d546eaab09d97376d88a3d0184183150ee --depth=1
          git checkout --detach 17b792d546eaab09d97376d88a3d0184183150ee

          set +e
          npm run typecheck > /tmp/baseline-typecheck.log 2>&1
          baseline_code=$?
          set -e
          grep 'error TS' /tmp/baseline-typecheck.log | sort > /tmp/baseline-errors.txt || true

          echo "=== current typecheck errors ==="
          cat /tmp/current-errors.txt
          echo "=== baseline typecheck errors ==="
          cat /tmp/baseline-errors.txt

          diff -u /tmp/baseline-errors.txt /tmp/current-errors.txt

          if [ "$current_code" -ne "$baseline_code" ]; then
            echo "::error::Typecheck exit status differs from baseline"
            exit 1
          fi

          git checkout --detach "$GITHUB_SHA"
      - name: Build
        run: npm run build
      - name: Full regression
        run: npx vitest run
