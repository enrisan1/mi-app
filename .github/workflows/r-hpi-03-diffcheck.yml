name: R-HPI-03 diff check
on:
  push:
    branches:
      - r-hpi-03-validation
permissions:
  contents: read
jobs:
  diffcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Diff check
        run: git diff --check 17b792d546eaab09d97376d88a3d0184183150ee..HEAD -- src/App.tsx src/App.hpi.validation.test.tsx
