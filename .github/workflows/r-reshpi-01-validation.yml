name: R-RESHPI-01 red contract
on:
  push:
    branches:
      - r-reshpi-01-red-contract
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Residual contract focal
        run: npx vitest run src/App.reshpi.test.tsx
      - name: Prior HPI preservation
        if: always()
        run: npx vitest run src/App.hpi.test.tsx src/App.hpi.validation.test.tsx src/App.hpi2.test.tsx src/App.hpi2.validation.test.tsx src/App.hpi.global.validation.test.tsx
      - name: Prior full regression excluding deliberate red contract
        if: always()
        run: npx vitest run --exclude src/App.reshpi.test.tsx
      - name: Production unchanged
        if: always()
        run: |
          git diff --exit-code 55814d30a495cf9e6b198da50cbbd65c89c65143..HEAD -- src/App.tsx src/realizations/ru2m1/ResumeExperience.tsx
      - name: Diff check
        if: always()
        run: git diff --check 55814d30a495cf9e6b198da50cbbd65c89c65143..HEAD -- src/App.reshpi.test.tsx
