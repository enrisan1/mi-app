name: CE-MIAPP temporary validation

on:
  push:
    branches:
      - feature/task-filters

jobs:
  ce-miapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run src/App.ce-miapp.test.tsx
