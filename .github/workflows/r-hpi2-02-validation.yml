name: R-HPI2-02 minimal validation
on:
  push:
    branches:
      - r-hpi2-02-minimal
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: HPI2 focused
        run: npx vitest run src/App.hpi2.test.tsx
      - name: HPI1 contracts and validation
        run: npx vitest run src/App.hpi.test.tsx src/App.hpi.validation.test.tsx
      - name: Full regression
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Typecheck delta against pre-change base
        run: |
          set +e
          npm run typecheck > /tmp/current-typecheck.log 2>&1
          current_code=$?
          grep 'error TS' /tmp/current-typecheck.log | sort > /tmp/current-errors.txt || true
          git checkout 5f6044eda910fc348fc2f8f865e1e609628aea71
          npm run typecheck > /tmp/base-typecheck.log 2>&1
          base_code=$?
          grep 'error TS' /tmp/base-typecheck.log | sort > /tmp/base-errors.txt || true
          set -e
          echo "current_code=$current_code base_code=$base_code"
          echo "current_errors=$(wc -l < /tmp/current-errors.txt)"
          echo "base_errors=$(wc -l < /tmp/base-errors.txt)"
          diff -u /tmp/base-errors.txt /tmp/current-errors.txt
          test "$current_code" -eq "$base_code"
      - name: Diff check
        run: |
          git checkout "$GITHUB_SHA"
          git diff --check 5f6044eda910fc348fc2f8f865e1e609628aea71..HEAD -- src/App.tsx
