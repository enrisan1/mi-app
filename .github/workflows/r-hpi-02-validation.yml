name: R-HPI-02 minimal context validation
on:
  push:
    branches:
      - r-hpi-02-minimal-context-validation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: HPI focal suite
        run: npx vitest run src/App.hpi.test.tsx
      - name: Full regression
        run: npx vitest run
